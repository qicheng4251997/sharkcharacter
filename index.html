<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady Steps</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--gold:#f6d365;--gold2:#d9b44a;--teal:#38c7ff;--bg1:#0f3a7a;--bg2:#030a1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
padding:24px 20px;background:radial-gradient(ellipse at 50% 20%,var(--bg1),var(--bg2) 75%);color:#fff;
font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;overflow-x:hidden}
.stage{width:min(340px,78vw);position:relative}
.mascot{width:100%;height:auto;animation:dance .9s ease-in-out infinite alternate;transform-origin:50% 100%;border-radius:0;filter:drop-shadow(0 12px 24px rgba(56,199,255,.45))}
@keyframes dance{0%{transform:rotate(-4deg) translateY(0)}100%{transform:rotate(4deg) translateY(-14px)}}
.arm{animation:arm .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes arm{to{transform:rotate(-18deg)}}
.shadow{width:55%;height:12px;margin:-4px auto 0;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(5px);animation:sh .9s ease-in-out infinite alternate}
@keyframes sh{to{transform:scale(.8);opacity:.6}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.7;animation:float 3s ease-in-out infinite}
.arm{}.s1{left:-6%;top:12%}.s2{right:-4%;top:55%;animation-delay:1s}.s3{left:20%;top:70%;animation-delay:2s}
@keyframes float{50%{transform:translateY(-16px);opacity:.2}}
.title{letter-spacing:.04em;font-weight:800;font-size:clamp(24px,7vw,34px);margin:0;text-align:center;text-shadow:0 0 18px rgba(56,199,255,.6)}
.pct{display:flex;align-items:baseline;justify-content:center;margin:0;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;
filter:drop-shadow(0 0 22px rgba(246,211,101,.55)) drop-shadow(0 4px 0 rgba(120,80,0,.55));animation:glow 1.6s ease-in-out infinite alternate}
.pct .n{font-size:clamp(78px,26vw,128px);letter-spacing:-.02em}
.pct .u{font-size:.5em;margin-left:4px}
.pct .n,.pct .u{background:linear-gradient(180deg,#fffbe0 0%,#ffe27a 45%,#d9a52b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,240,170,.35)}
.pct .u{font-size:clamp(40px,13vw,64px)}
@keyframes glow{to{filter:drop-shadow(0 0 36px rgba(246,211,101,.9)) drop-shadow(0 4px 0 rgba(120,80,0,.55))}}
.pct.done{animation:pop .7s cubic-bezier(.2,1.6,.4,1) 1,glow 1.6s ease-in-out .7s infinite alternate}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-2deg)}100%{transform:scale(1)}}
.tag{margin:-6px 0 0;font-size:13px;letter-spacing:.3em;color:#9fdcff;text-indent:.3em}
.bar{width:min(440px,86%);height:16px;border-radius:99px;padding:3px;background:#0b1a22;border:2px solid #3a4a52}
.fill{position:relative;height:100%;width:0;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,var(--teal),var(--gold));box-shadow:0 0 14px rgba(56,199,255,.7)}
.fill::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 10px,transparent 10px 22px);background-size:44px 100%;animation:stripe .8s linear infinite}
.fill::after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shine 1.4s ease-in-out infinite}
@keyframes stripe{to{background-position:44px 0}}
@keyframes shine{from{left:-60px}to{left:100%}}
.cta{width:min(480px,92%);display:flex;align-items:center;justify-content:center;gap:14px;padding:20px;border-radius:99px;
border:0;cursor:pointer;text-decoration:none;color:#1a1a1a;font-weight:800;letter-spacing:.03em;font-size:clamp(15px,4.6vw,19px);text-align:center;
background:linear-gradient(90deg,#fff1a8,var(--gold2));box-shadow:0 0 30px rgba(246,211,101,.45);
animation:pulse 1.4s ease-in-out infinite}
.cta:active{transform:scale(.97)}
.cta .hand{display:inline-block;animation:tap 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 52px rgba(246,211,101,.8);transform:scale(1.03)}}
@keyframes tap{50%{transform:translate(4px,6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
