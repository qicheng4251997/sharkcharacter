<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brightwave · Exclusive Access</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--gold:#f6d365;--gold2:#b98a2b;--sea:#2fb5e8;--deep:#031a3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#fff;font-family:Outfit,-apple-system,"Helvetica Neue",Arial,sans-serif;
background:radial-gradient(70% 40% at 50% 8%,#0f5a9c,transparent 70%),linear-gradient(180deg,#06285a 0%,#031a3c 55%,#020c20 100%);
display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 20px 150px;overflow-x:hidden;position:relative}
body>*{position:relative;z-index:2}
.pill{font-size:12px;font-weight:600;letter-spacing:.26em;color:var(--gold);border:1px solid rgba(246,211,101,.4);background:rgba(246,211,101,.08);padding:8px 18px;border-radius:99px}
.scene{position:relative;width:min(270px,72vw);aspect-ratio:1;margin-top:14px}
.sonar{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(246,211,101,.55);animation:ping 2.8s ease-out infinite;z-index:0}
.sonar.d{animation-delay:1.4s}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
.port{position:absolute;inset:0;border-radius:50%;padding:13px;background:linear-gradient(145deg,#fff1a8,#a97a22 55%,#f0cf6a);box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 44px rgba(246,211,101,.3);z-index:1}
.port::after{content:"";position:absolute;inset:3px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(rgba(90,59,5,.75) 0 2.5deg,transparent 2.5deg 22.5deg);
-webkit-mask:radial-gradient(circle closest-side,transparent 91%,#000 92%,#000 97%,transparent 98%);mask:radial-gradient(circle closest-side,transparent 91%,#000 92%,#000 97%,transparent 98%)}
.water{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 28%,#37c0f0,#0b4a8f 55%,#031a3c);box-shadow:inset 0 0 40px rgba(0,0,0,.65)}
.rays{position:absolute;inset:-25%;background:repeating-conic-gradient(from 200deg at 50% -8%,rgba(255,255,255,.15) 0 6deg,transparent 6deg 16deg);animation:rs 6s ease-in-out infinite alternate}
@keyframes rs{to{transform:rotate(9deg)}}
.shark{position:absolute;width:106%;left:-3%;top:4%;height:auto;animation:swim 3s ease-in-out infinite alternate;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
@keyframes swim{from{transform:translate(-6px,5px) rotate(-3deg)}to{transform:translate(6px,-7px) rotate(3deg)}}
.bub{position:absolute;bottom:-10%;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.14);animation:rise 5s linear infinite}
@keyframes rise{from{bottom:-10%;opacity:.9}to{bottom:105%;opacity:0}}
.glass{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.3),transparent 40%);pointer-events:none}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(33px,9.6vw,44px);line-height:1.08;margin:10px 0 0;text-align:center}
h1 span{background:linear-gradient(180deg,#fffbe0,#ffd75a 60%,#d9a52b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(246,211,101,.4))}
.lead{margin:0;color:#a9c7e6;text-align:center;font-size:15px;max-width:30ch}
.card{display:flex;align-items:center;gap:14px;width:min(400px,100%);padding:14px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .gi{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,#fff1a8,#c9922a);box-shadow:0 0 20px rgba(246,211,101,.4)}
.card .tx{flex:1;line-height:1.25}
.card small{display:block;font-size:11px;letter-spacing:.22em;color:#8fb3d6;font-weight:600}
.card b{font-size:18px}
.rdy{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#5ff0b0}
.rdy::before{content:"";width:8px;height:8px;border-radius:50%;background:#5ff0b0;box-shadow:0 0 10px #5ff0b0;animation:bl 1.2s ease-in-out infinite}
@keyframes bl{50%{opacity:.3}}
.slide{position:relative;width:min(400px,100%);height:64px;border-radius:99px;background:linear-gradient(90deg,#0b5fb8,#2fb5e8);box-shadow:0 12px 28px rgba(47,181,232,.35);overflow:hidden;user-select:none}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22)}
.slide .lb{position:absolute;inset:0;display:grid;place-items:center;padding-left:48px;font-weight:800;letter-spacing:.04em;font-size:clamp(14px,4.2vw,16px);
background:linear-gradient(100deg,rgba(255,255,255,.6) 30%,#fff 50%,rgba(255,255,255,.6) 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.knob{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;font-size:24px;cursor:grab;touch-action:none;background:linear-gradient(180deg,#fff2c2,#e0b040);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.knob.back{transition:transform .3s}
.slide.done .lb{animation:none;-webkit-text-fill-color:#fff;color:#fff}
.waves{position:fixed;left:0;right:0;bottom:0;height:130px;overflow:hidden;pointer-events:none;z-index:1}
.waves i{position:absolute;left:0;right:0;bottom:0;height:100%;background-repeat:repeat-x;background-size:520px 100%}
.w1{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 130%22 preserveAspectRatio=%22none%22%3E%3Cpath d=%22M0 60 Q150 20 300 60 T600 60 V130H0Z%22 fill=%22rgba%2847%2C181%2C232%2C.28%29%22/%3E%3C/svg%3E");animation:wv1 9s linear infinite}
.w2{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 130%22 preserveAspectRatio=%22none%22%3E%3Cpath d=%22M0 80 Q150 45 300 80 T600 80 V130H0Z%22 fill=%22rgba%2811%2C95%2C184%2C.55%29%22/%3E%3C/svg%3E");animation:wv2 14s linear infinite}
@keyframes wv1{to{background-position-x:-520px}}@keyframes wv2{to{background-position-x:520px}}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>

var LINK="https://www.ipay9myr.store/?aff=nsads1"; // 滑动完成后的跳转链接
var slide=document.getElementById("slide"),knob=document.getElementById("knob"),fill=document.getElementById("fill"),lb=document.getElementById("lb");
var sx=0,x=0,drag=false,done=false;
function max(){return slide.clientWidth-knob.offsetWidth-12}
function set(v){x=v;knob.style.transform="translateX("+v+"px)";fill.style.width=(v+58)+"px"}
knob.addEventListener("pointerdown",function(e){if(done)return;drag=true;sx=e.clientX-x;knob.classList.remove("back");knob.setPointerCapture(e.pointerId)});
knob.addEventListener("pointermove",function(e){if(drag)set(Math.max(0,Math.min(max(),e.clientX-sx)))});
function end(){if(!drag)return;drag=false;if(x>max()*.85)finish();else{knob.classList.add("back");set(0)}}
knob.addEventListener("pointerup",end);knob.addEventListener("pointercancel",end);
knob.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")finish()});
function finish(){if(done)return;done=true;knob.classList.add("back");set(max());slide.classList.add("done");knob.textContent="✓";
 lb.textContent="Redirecting in 3 seconds…";bubbles();
 setTimeout(function(){lb.textContent="Redirecting in 2 seconds…"},1000);
 setTimeout(function(){lb.textContent="Redirecting in 1 second…"},2000);
 setTimeout(function(){window.location.assign(LINK)},3000)}
var cv=document.getElementById("cv"),cx=cv.getContext("2d"),P=[];
function bubbles(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 var w=cv.width=innerWidth,h=cv.height=innerHeight,C=["#f6d365","#fff1a8","#2fb5e8","#9fe3ff","#ffffff"];
 for(var i=0;i<110;i++){var fromLeft=i%2;P.push({x:Math.random()*w,y:h+10,vx:(Math.random()-.5)*2,vy:-(6+Math.random()*9),s:4+Math.random()*9,c:C[i%5],t:Math.random()*6,g:.18,ring:i%3===0})}
 requestAnimationFrame(step)}
function step(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.y>-20});
 P.forEach(function(p){p.vy*=.985;p.vy-=.03;p.t+=.08;p.x+=p.vx+Math.sin(p.t)*.8;p.y+=p.vy;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);
  if(p.ring){cx.strokeStyle=p.c;cx.lineWidth=2;cx.stroke()}else{cx.fillStyle=p.c;cx.globalAlpha=.85;cx.fill();cx.globalAlpha=1}});
 if(P.length)requestAnimationFrame(step)}
